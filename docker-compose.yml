# Dokploy / docker-compose deployment for the workshop skeleton app.
# Set GITHUB_TOKEN (scope: copilot) in the Dokploy Environment tab.
# Route a domain to this service on port 3100.

services:
  ibp-chat-skeleton:
    build:
      context: ./ibp-chat
      dockerfile: Dockerfile
    image: ibp-chat-skeleton:latest
    container_name: ibp-chat-skeleton
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3100"
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    expose:
      - "3100"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  dokploy-network:
    external: true
